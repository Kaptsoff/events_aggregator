[project]
name = "events-aggregator"
version = "0.1.0"
description = "Backend aggregator for Events Provider API"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic-settings>=2.6",
  "email-validator>=2.2",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.32",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
test = ["pytest>=8.3", "pytest-cov>=6.0"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
